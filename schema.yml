components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category_name:
          type: string
          maxLength: 255
        description:
          type: string
      required:
      - category_name
      - description
      - id
    ForgotPassword:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Register:
      type: object
      properties:
        fullname:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        confirm_password:
          type: string
          writeOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - confirm_password
      - email
      - fullname
      - password
    ResetPassword:
      type: object
      properties:
        reset_token:
          type: string
        new_password:
          type: string
          writeOnly: true
      required:
      - new_password
      - reset_token
    RoleEnum:
      enum:
      - student
      - instructor
      - admin
      type: string
      description: |-
        * `student` - Student
        * `instructor` - Instructor
        * `admin` - Admin
    SendOTP:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    Settings:
      type: object
      properties:
        user:
          type: integer
        language:
          type: string
          maxLength: 50
        switch_role:
          type: string
          maxLength: 50
        payment_method:
          type: string
          maxLength: 100
      required:
      - language
      - payment_method
      - switch_role
      - user
    User:
      type: object
      properties:
        user_id:
          type: integer
          readOnly: true
        fullname:
          type: string
          maxLength: 255
        username:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - fullname
      - user_id
      - username
    VerifyOTP:
      type: object
      properties:
        email:
          type: string
          format: email
        otp_code:
          type: string
          maxLength: 10
      required:
      - email
      - otp_code
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
